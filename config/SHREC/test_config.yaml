data_dir: "input/SHREC/obj/k_10"
output_dir: "results/SHREC/preprocess"   # FPS .pp debug files
result_dir: "results/SHREC"            # logs, checkpoints, p2p maps, evaluation
cache_dir: "cache/SHREC"

# Ground truth (validation + evaluation only; never used for training)
gt:
  format: "map"                  # SHREC'19: i_j.map, line v of shape i -> vertex of shape j (1-based)
  map_dir: "input/SHREC/map"
  mat_dir: "input/SHREC/mat"     # optional geodesic matrices; computed if missing
  off_dir: "input/SHREC/off"     # meshes: only geodesic_error.py (area + geodesics)
  exclude: ["40"]                # shape 40 is partial (standard protocol)

# SHREC'19 protocol: every shape is used for (unsupervised) training and for testing
split:
  mode: "all"
  validation_pairs: 4            # validation shapes = shapes of the first 4 GT pairs

geometry:
  k: 50
  t: 100
  neigvecs: 300
  n_biharmonic: 100     # eigenpairs used for the biharmonic (intrinsic) embedding

# 2D (DINOv2) features computed directly from the point cloud - no mesh (DV-Matcher-style projection)
dino:
  enabled: false
  cache_dir: "cache/SHREC/dino"
  upsampler: "bilinear"    # "bilinear" (DINOv2, no install) | "featup" (DV-Matcher; needs pip install of FeatUp)
  variant: "dinov2_vits14" # bilinear backbone (FeatUp uses its own ViT-S/14)
  views: "orbit"           # "orbit" (yaw-robust, averaged) | "dvmatcher" (3 axis views, concatenated)
  projection: "zbuffer"    # "zbuffer" (visibility + confidence) | "xray" (DV-Matcher, summed depth)
  n_azimuth: 8             # orbit: views per elevation ring
  elevations_deg: [-30, 0, 30]
  img_size: 448            # 448 -> 32x32 DINOv2 patches (224 for featup)
  splat: 3                 # each point covers (2*splat+1)^2 pixels (DV-Matcher: 2 -> 5x5 at 224 px)
  colormap: "PiYG"         # depth-map colouring (DV-Matcher)
  depth_tol: 0.02          # zbuffer visibility tolerance (fraction of shape diameter)
  smooth_k: 8              # kNN feature smoothing (0 = off)
  batch_views: 4

testing:
  device: "cuda"
  mask_ratio: 0.6
  feature_ratio: 0.35
  checkpoint_dir: "results/SHREC/checkpoints"
  checkpoint_name: "model_SHREC_best.pth"

model:
  embed_dim: 128
  depth: 4
  num_heads: 4
  decoder_embed_dim: 64
  decoder_depth: 2
  decoder_num_heads: 4
  mlk_ratio: 2.0
  num_mask_queries: 5000
  encoder_k: 20
  aamg_k: 10
  aamg_emb_dim: 64
  pos_embed_dim: 64
  temperature: 0.1
