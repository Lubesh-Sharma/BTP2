data_dir: "input/SHREC/obj/k_10"
output_dir: "output_st_te_SHREC"
train_size: 26
test_size: 18

geometry:
  k: 50
  t: 100
  neigvecs: 300
  
training:
  epochs: 60
  lr: 0.00025
  device: "cuda"
  noise_variance: 0.0
  student_mask_ratio: 0.60
  student_feature_ratio: 0.35
  teacher_mask_ratio: 0.10
  teacher_feature_ratio: 0.10
  ema_alpha: 0.999
  checkpoint_dir: "checkpoints"
  checkpoint_name: "st_te_model_SHREC_oem_staged.pth"
  angle_label_smoothing: 0.0
  consistency_weight: 50.0
  contrastive_margin: 0.45
  contrastive_weight: 100.0
  cycle_eps: 0.015
  cycle_n_iter: 25
  cycle_weight: 100.0
  lgo_eps: 0.020
  lgo_target_eps: 0.015
  lgo_weight: 50.0
  lgo_weight_init: 0.0
  lgo_start_epoch: 5
  lgo_warmup_epochs: 15
  distortion_weight: 350.0
  distortion_tau: 0.015
  distortion_samples: 512
  orientation_weight: 0.0  # Legacy world-normal loss is logged, not optimized.
  angle_weight: 1.0
  angle_weight_init: 1.0
  angle_warmup_epochs: 10
  domain_weight: 0.1
  grad_clip: 5.0
  seed: 42

oem:
  max_points: 512
  pretrain_epochs: 30
  lr: 0.00025
  freeze_epochs: 10
  finetune_lr: 0.000025
  minimum_eval_accuracy: 0.95  # Both directions on held-out rotation examples.
  domain_start_epoch: 10
  domain_warmup_epochs: 10
  domain_weight: 0.1
  label_smoothing: 0.0
  canonical_pairs: []  # Optional {source, target, angle_bin}; bin 1 = aligned.

validation:
  shape_count: 4  # Within the reserved 26; the final 18 test shapes stay unused.
  every_epochs: 5
  max_pairs: 6
  vertices: 256
  map_index_base: 1

student_model:
  embed_dim: 128
  depth: 4
  num_heads: 4
  decoder_embed_dim: 64
  decoder_depth: 2
  decoder_num_heads: 4
  mlk_ratio: 2.0
  num_mask_queries: 5000
  encoder_k: 20
  aamg_k: 10
  aamg_emb_dim: 64
  pos_embed_dim: 64
  temperature: 0.1

teacher_model:
  embed_dim: 128
  depth: 4
  num_heads: 4
  decoder_embed_dim: 64
  decoder_depth: 2
  decoder_num_heads: 4
  mlk_ratio: 2.0
  num_mask_queries: 5000
  encoder_k: 20
  aamg_k: 10
  aamg_emb_dim: 64
  pos_embed_dim: 64
  temperature: 0.1
