data_dir: "input/SHREC/obj/k_10"
output_dir: "output_st_te_SHREC"
train_size: 26
test_size: 18

geometry:
  k: 50
  t: 100
  neigvecs: 300
  
training:
  epochs: 60
  lr: 0.00025
  device: "cuda"
  student_mask_ratio: 0.60
  student_feature_ratio: 0.35
  teacher_mask_ratio: 0.10
  teacher_feature_ratio: 0.10
  ema_alpha: 0.999
  checkpoint_dir: "checkpoints"
  checkpoint_name: "st_te_model_SHREC.pth"
  consistency_weight: 50.0
  contrastive_margin: 0.45
  contrastive_weight: 100.0
  cycle_eps: 0.015
  cycle_n_iter: 25
  cycle_weight: 100.0
  lgo_eps: 0.020
  lgo_target_eps: 0.015
  lgo_weight: 200.0
  lgo_weight_init: 25.0
  lgo_warmup_epochs: 5
  distortion_weight: 200.0
  distortion_tau: 0.015
  distortion_samples: 512
  orientation_weight: 250.0
  angle_weight: 30.0
  angle_weight_init: 60.0
  angle_warmup_epochs: 10
  domain_weight: 500.0


student_model:
  embed_dim: 128
  depth: 4
  num_heads: 4
  decoder_embed_dim: 64
  decoder_depth: 2
  decoder_num_heads: 4
  mlk_ratio: 2.0
  num_mask_queries: 5000
  encoder_k: 20
  aamg_k: 10
  aamg_emb_dim: 64
  pos_embed_dim: 64
  temperature: 0.1

teacher_model:
  embed_dim: 128
  depth: 4
  num_heads: 4
  decoder_embed_dim: 64
  decoder_depth: 2
  decoder_num_heads: 4
  mlk_ratio: 2.0
  num_mask_queries: 5000
  encoder_k: 20
  aamg_k: 10
  aamg_emb_dim: 64
  pos_embed_dim: 64
  temperature: 0.1
